name: Qodana - Static Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - release
  push:
    branches:
      - main
      - develop
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  qodana:
    name: Qodana JVM Community
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Qodana Static Analysis
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: --linter,jetbrains/qodana-jvm-community:2026.2
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          use-annotations: true
          upload-result: true
          push-fixes: 'none'

      - name: Set up JDK 25
        if: always() && github.event_name != 'pull_request'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: always() && github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Extract, apply, and format library version fixes
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: python3 .github/scripts/apply_qodana_fixes.py

      - name: Create Pull Request for library upgrades
        if: always() && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(deps): upgrade library versions in build.gradle from Qodana scan"
          title: "fix(deps): upgrade library versions in build.gradle"
          body-path: .github/templates/qodana_pr_body.md
          branch: qodana/library-upgrades
          base: ${{ github.base_ref || github.ref_name }}
          add-paths: |
            build.gradle
          delete-branch: true
          labels: |
            dependencies
            qodana
